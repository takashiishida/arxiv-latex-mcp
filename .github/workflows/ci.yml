name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked python -c "import arxiv_latex_mcp; import arxiv_latex_mcp.server; print('OK')"
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
      - name: Verify release metadata and build desktop extension
        if: matrix.python-version == '3.13'
        run: |
          uv run --locked python scripts/check_release.py
          uvx twine check dist/*
          uv run --locked python scripts/build_bundle.py
